name: CI/CD

on:
  pull_request:
  push:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: noghterangi_test
          POSTGRES_USER: noghterangi_test
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U noghterangi_test -d noghterangi_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@7a445ee88d4e23b52c33bbc22b1b3c5cf58f8265 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/noghterangi_test
          TEST_DB_USERNAME: noghterangi_test
          TEST_DB_PASSWORD: ci-ephemeral-password

  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and publish to GHCR
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image:$GITHUB_SHA" .
          docker push "$image:$GITHUB_SHA"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
          [[ "$reference" == "$image@sha256:"* ]]
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"

  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Deploy the published digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq .commit.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on the default branch. Skipping this release.'
            exit 0
          fi
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy.key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/deploy.known_hosts"
          printf '%s\n' "$IMAGE" | ssh -T -i "$RUNNER_TEMP/deploy.key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy.known_hosts" -o ConnectTimeout=15 \
            -l "$DEPLOY_USER" -- "$DEPLOY_HOST" deploy
