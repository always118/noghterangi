<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="card(product, imageId)" class="card product-card h-100 catalog-card" th:attr="data-catalog-product=${product.id}">
    <div class="catalog-image">
        <span class="image-placeholder h-100" th:hidden="${imageId != null}">بدون تصویر</span>
        <img th:if="${imageId != null}" th:src="@{/media/{id}(id=${imageId})}" th:alt="${product.name}" data-catalog-image loading="lazy" width="320" height="240">
    </div>
    <div class="card-body d-flex flex-column gap-2">
        <span class="badge text-bg-warning align-self-start" th:if="${product.featured}">ویژه</span>
        <h2 class="h6 catalog-name" th:title="${product.name}"><a th:href="@{/products/{slug}(slug=${product.slug})}" th:text="${product.name}"></a></h2>
        <p class="mb-0 mt-auto catalog-price"><bdi th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}"></bdi> تومان</p>
        <span class="small" th:classappend="${product.stockQuantity > 0} ? 'text-success' : 'text-secondary'"
              th:text="${product.stockQuantity > 0} ? 'موجود' : 'ناموجود'"></span>
    </div>
</article>
</body>
</html>
