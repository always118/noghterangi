<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="messages">
    <div th:if="${successMessage != null}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
</th:block>
</body>
</html>
