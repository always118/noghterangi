<div th:fragment="image-editor" id="image-editor" class="image-editor" hidden role="dialog" aria-modal="true"
     aria-labelledby="image-editor-title" aria-describedby="image-editor-help">
    <div class="image-editor__panel">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <div>
                <h2 id="image-editor-title" class="h5 mb-1">برش تصویر</h2>
                <p id="image-editor-help" class="small text-muted mb-0">تصویر را جابه‌جا یا با لمس/چرخ ماوس بزرگ‌نمایی کنید.</p>
            </div>
            <button id="image-editor-cancel-top" type="button" class="btn btn-outline-secondary btn-sm">انصراف</button>
        </div>
        <div class="image-editor__workspace">
            <div class="image-editor__canvas-wrap">
                <img id="image-editor-image" alt="پیش‌نمایش تصویر برای برش">
            </div>
            <div class="image-editor__preview-wrap">
                <span class="small text-muted">پیش‌نمایش نهایی</span>
                <img id="image-editor-preview" alt="پیش‌نمایش تصویر برش‌خورده">
                <span id="image-editor-progress" class="small text-muted" aria-live="polite"></span>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button id="image-editor-zoom-out" type="button" class="btn btn-outline-secondary">کوچک‌نمایی</button>
            <button id="image-editor-zoom-in" type="button" class="btn btn-outline-secondary">بزرگ‌نمایی</button>
            <button id="image-editor-reset" type="button" class="btn btn-outline-secondary">بازنشانی</button>
            <span class="flex-grow-1"></span>
            <button id="image-editor-cancel" type="button" class="btn btn-outline-danger">لغو بارگذاری</button>
            <button id="image-editor-confirm" type="button" class="btn btn-primary">تأیید و بارگذاری</button>
        </div>
    </div>
    <link rel="stylesheet" th:href="@{/vendor/cropperjs/cropper.min.css}">
    <script th:src="@{/vendor/cropperjs/cropper.min.js}"></script>
    <script th:src="@{/js/image-editor.js}"></script>
</div>
