<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('ورود مدیر', ~{::content})}">
<head><title>ورود مدیر</title></head>
<body><section th:fragment="content" aria-labelledby="login-title">
    <div class="row justify-content-center"><div class="col-md-8 col-lg-5">
        <div class="category-card bg-white border">
            <h1 id="login-title" class="h3 mb-3">ورود به مدیریت نقطه رنگی</h1>
            <p class="text-muted">برای دسترسی به بخش مدیریت وارد شوید.</p>
            <p th:if="${param.error != null}" class="alert alert-danger" role="alert">نام کاربری یا رمز عبور نادرست است.</p>
            <p th:if="${param.logout != null}" class="alert alert-success" role="status">با موفقیت خارج شدید.</p>
            <form method="post" th:action="@{/admin/login}">
                <div class="mb-3">
                    <label class="form-label" for="username">نام کاربری</label>
                    <input class="form-control" id="username" name="username" type="text" autocomplete="username" dir="auto" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">رمز عبور</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">ورود</button>
            </form>
        </div>
    </div></div>
</section></body>
</html>
