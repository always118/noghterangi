spring.application.name=noghte-rangi

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/noghterangi}
spring.datasource.username=${DB_USERNAME:noghterangi}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=noghterangi
spring.sql.init.mode=never

spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# No default administrator credentials. Supply a BCrypt hash, never a raw password.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Outside classpath; use a persistent, application-owned directory in deployment.
app.media.storage-path=${MEDIA_STORAGE_PATH:uploads/media}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB

# Guest checkout is unavailable until all three payment instructions are configured.
store.payment.card-number=${STORE_PAYMENT_CARD_NUMBER:}
store.payment.account-name=${STORE_PAYMENT_ACCOUNT_NAME:}
store.payment.instructions=${STORE_PAYMENT_INSTRUCTIONS:}
