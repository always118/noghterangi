spring.application.name=noghte-rangi

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/noghterangi}
spring.datasource.username=${DB_USERNAME:noghterangi}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=noghterangi
spring.sql.init.mode=never

spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# No default administrator credentials. Supply a BCrypt hash, never a raw password.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
