# Local development and deployment baseline. Secrets stay in the untracked .env file.
services:
  postgres:
    image: postgres:16.15-bookworm
    restart: always
    environment:
      POSTGRES_DB: noghterangi
      POSTGRES_USER: noghterangi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noghterangi -d noghterangi"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
    env_file:
      - ${APP_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/noghterangi
      DB_USERNAME: ${DB_USERNAME:-noghterangi}
      MEDIA_STORAGE_PATH: /app/data/media
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - media-data:/app/data/media
      - ./noghterangi-export:/app/noghterangi-export:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres-test:
    image: postgres:16.15-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: noghterangi_test
      POSTGRES_USER: noghterangi_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noghterangi_test -d noghterangi_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  media-data:
